name: Production Smoke Test

on:
  schedule:
    - cron: '0 20 * * *' # daily ~06:00 AEST
  workflow_dispatch:

jobs:
  smoke:
    name: Session create with restaurant search
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Smoke test production backend
        run: bash scripts/smoke-prod.sh

      # Supabase pauses a free-tier project after a week without API requests, and this
      # one only sees traffic when someone signs in or opens Friends. A daily read keeps it
      # awake; a paused project fails DNS and turns this job red, which is the alert.
      - name: Keep the Supabase project awake
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            'https://hcjuqvicwuszwqkreklc.supabase.co/rest/v1/profiles?select=id&limit=1') || code=000
          [ "$code" = "200" ] && echo "OK: Supabase answered 200" || { echo "FAIL: Supabase answered ${code} (000 = paused, DNS gone)"; exit 1; }
