<html lang="en">

    />
    <meta
      name="description"
      content="Heykeen — Pick somewhere to eat, something to cook, or something to watch with your people."

    <!-- Link unfurl (static on every route; intentionally no url tag) -->
    <meta property="og:site_name" content="Heykeen" />

    <meta property="og:title" content="Heykeen — What are we doing tonight?" />

      property="og:image:alt"

    <meta name="twitter:title" content="Heykeen — What are we doing tonight?" />

      name="twitter:description"
      content="Choose food, recipes, movies and series together. Everyone gets a say. No account needed."
    />
    <meta name="twitter:image" content="https://www.dinder.it.com/images/heykeen-share.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/heykeen-icon-192.png" />
